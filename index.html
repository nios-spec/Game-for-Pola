let audioCtx = null, muted = false;
function initAudio() {
  if (!audioCtx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) audioCtx = new AC(); }
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
}
function tone({ type="sine", from, to, dur, vol=0.3, start=0, filter }) {
  if (!audioCtx || muted) return;
  const t = audioCtx.currentTime + start;
  const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(from, t);
  osc.frequency.exponentialRampToValueAtTime(to, t + dur);
  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.exponentialRampToValueAtTime(vol, t + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  if (filter) {
    const f = audioCtx.createBiquadFilter();
    f.type = filter.type; f.frequency.value = filter.freq; f.Q.value = filter.q || 1;
    osc.connect(f); f.connect(gain);
  } else osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(t); osc.stop(t + dur + 0.05);
}
function noise(dur, vol, freq) {
  if (!audioCtx || muted) return;
  const len = Math.floor(audioCtx.sampleRate * dur);
  const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
  src.buffer = buf; f.type = "bandpass"; f.frequency.value = freq; g.gain.value = vol;
  src.connect(f); f.connect(g); g.connect(audioCtx.destination);
  src.start();
}

}

//  DRAWING TOOLKIT: animated animal & human sprites (all drawn in code)
// ============================================================
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const shade = (hex, a) => {
  const n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const f = c => Math.max(0, Math.min(255, Math.round(a < 0 ? c * (1 + a) : c + (255 - c) * a)));
  return `rgb(${f(r)},${f(g)},${f(b)})`;
};
function ell(g, x, y, rx, ry, fill, rot = 0) {
  g.fillStyle = fill; g.beginPath(); g.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), rot, 0, 7); g.fill();
}
function tri(g, ax, ay, bx, by, cx, cy, fill) {
  g.fillStyle = fill; g.beginPath(); g.moveTo(ax, ay); g.lineTo(bx, by); g.lineTo(cx, cy); g.closePath(); g.fill();
}
function line(g, x1, y1, x2, y2, col, w) {
  g.strokeStyle = col; g.lineWidth = w; g.lineCap = "round"; g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke();
}

// ---- quadrupeds: cat, dog, hamster, fox, raccoon... (drawn facing right, origin = feet) ----
function quad(g, L, t, mv) {
  const bw = 15 * L.len, bh = 8.5 * L.h, leg = L.leg, hr = 7.5 * L.head, by = -leg - bh * 0.55 - (mv ? Math.abs(Math.sin(t)) * 1.6 : Math.sin(t * 0.8) * 0.3);
  const amp = mv ? 6 : 0.5, hx = bw * 0.78, hy = by - bh * 0.85 + (mv ? Math.sin(t * 2) * 0.9 : 0), far = shade(L.c, -0.3);
  const legAt = (x, ph, col) => {
    const a = Math.sin(t + ph) * amp, lift = mv ? Math.max(0, Math.cos(t + ph)) * 4.5 : 0;
    const hipY = by + bh * 0.3, fx = x + a, fy = -2 - lift, hind = x < 0;
    const kx = (x + fx) / 2 + (hind ? -2.8 : 2.2) - (mv ? lift * 0.25 : 0), ky = (hipY + fy) / 2;
    line(g, x, hipY, kx, ky, col, 5.2);            // thigh
    line(g, kx, ky, fx, fy, col, 3.6);             // shin
    ell(g, fx + 1.6, fy + 0.4, 3.6, 2.1, col === L.c ? shade(L.c, -0.1) : col);   // paw
    ell(g, fx + 3, fy + 0.8, 1.4, 1.2, L.belly);   // toes

  if (scene === "map" && player && player.visible && nightPrev !== isNight()) { nightPrev = isNight(); say(nightPrev ? "🌙 Night falls: owls and raccoons come out, the lanterns glow!" : "☀️ Dawn breaks."); }
  if (scene === "map" && player && player.visible && !dialog && T > wNext) {
    const w = ["clear", "clear", "rain"][ri(0, 2)];
    if (wNext && w !== weather) { weather = w; say(w === "rain" ? "☔ Rain starts: cats are weaker!" : w === "night" ? "🌙 Night falls: cats, snakes and birds turn aggressive!" : "☀️ The sky clears up."); }
    wNext = T + ri(45000, 90000);
  }
  if (fxs.length > 24) fxs.splice(0, fxs.length - 12);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
